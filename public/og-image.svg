    <rect x="82" y="74" width="1036" height="482" rx="36" fill="none" stroke="#d9e2ee"/>
  </g>
  <g transform="translate(134 124)">
    <rect width="76" height="76" rx="18" fill="#113f49"/>
    <path d="M22 20h17c5 0 9 4 9 9v31H30c-5 0-8-3-8-8z" fill="#fff" opacity="0.95"/>
    <path d="M48 20h8c5 0 9 4 9 9v31H48z" fill="#fff" opacity="0.82"/>
