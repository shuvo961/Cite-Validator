    <rect x="164" width="188" height="48" rx="24" fill="#fff7ed"/><text x="190" y="31" fill="#d97706">Needs review</text>
    <rect x="372" width="174" height="48" rx="24" fill="#fef2f2"/><text x="400" y="31" fill="#dc2626">Suspicious</text>
  </g>
  <g transform="translate(820 214)">
