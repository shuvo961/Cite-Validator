<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cite Validator preview</title>
  <desc id="desc">Free academic citation checker and hallucinated reference detector.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="140" cy="120" r="160" fill="#3558f6" opacity="0.12"/>
  <circle cx="1030" cy="130" r="190" fill="#0e9f6e" opacity="0.12"/>
  <circle cx="930" cy="550" r="170" fill="#e55f72" opacity="0.09"/>
  <g filter="url(#shadow)">
