<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Validation Report - Cite Validator</title>
    <meta name="description" content="Saved Cite Validator report with citation status, confidence, hallucination risk, corrected references, and export links.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="ambient-page">
      <header class="site-header product-nav">
        <button class="mobile-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">Menu</button>
        <a class="brand" href="/"><img src="/logo.svg" alt="" class="brand-logo"><span>Cite Validator</span></a>
        <nav class="site-nav"><a href="/dashboard">Dashboard</a><a href="/validate">Validator</a><a href="/converter">Converter</a></nav>
        <div class="nav-actions"><button class="theme-toggle" type="button" data-theme-toggle>Dark</button><a class="login-link" data-auth-link href="/login">Login</a></div>
      </header>
      <main class="validator-page">
        <section class="page-hero compact-hero glass-panel">
          <p class="eyebrow">Saved report</p>
          <h1>Validation report</h1>
          <p id="reportMeta">Loading report...</p>
          <div class="actions">
            <button id="rerunReportBtn" class="secondary" type="button">Re-run validation</button>
            <a id="reportPdf" class="download disabled" href="#">PDF</a>
            <a id="reportCsv" class="download disabled" href="#">CSV</a>
            <a id="reportDoc" class="download disabled" href="#">DOC</a>
            <a id="reportBib" class="download disabled" href="#">BibTeX</a>
            <a id="reportRis" class="download disabled" href="#">RIS</a>
          </div>
        </section>
        <section class="dashboard-analytics glass-panel">
          <div class="panel-heading"><div><h2>Report summary</h2><p>Outcome mix and confidence overview.</p></div></div>
          <div id="reportSummary" class="chart-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></div>
        </section>
        <section class="results-section glass-panel">
          <div class="panel-heading"><div><h2>References</h2><p>Open each dropdown for full evidence and field comparisons.</p></div></div>
          <div id="reportResults" class="results-list"></div>
        </section>
      </main>
    </div>
    <script src="/site.js" type="module"></script>
    <script src="/report.js" type="module"></script>
  </body>
</html>
