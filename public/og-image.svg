    <path d="m63 62 9 9" stroke="#b88724" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="232" y="154" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#07111f">Cite Validator</text>
  <text x="134" y="258" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900" fill="#07111f">Free Citation Checker</text>
  <text x="134" y="328" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#3558f6">Detect hallucinated and fabricated references</text>
  <text x="134" y="392" font-family="Inter, Arial, sans-serif" font-size="24" fill="#475569">Validate DOI, title, authors, journal, year, pages, ISBN, PMID, arXiv, and more.</text>
